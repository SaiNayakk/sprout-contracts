openapi: 3.0.3
info:
  title: Sprout Payments API
  version: 1.0.0
  description: |
    Moving money between a customer's Sprout Bank account and their Sprout account.

    Clients reach these endpoints through the gateway under `/api/payments`. Every endpoint except the
    bank's callback needs a signed-in user with an open Sprout account.

    **Adding money** is a UPI collect request: Sprout asks the customer's bank for the money, the
    customer approves it in the bank with their UPI PIN, the bank tells Sprout, and the money appears
    in the customer's Sprout balance. Until then the deposit is `AWAITING_APPROVAL`; it can end
    `COMPLETED`, `DECLINED` (the customer said no) or `EXPIRED` (nobody answered in time).

    **Withdrawing** takes the amount out of the available balance at once (held), asks the bank to pay
    it out, then settles; if the bank fails, the hold is released and the money is available again.

    **AutoPay** (for round-ups): the customer asks Sprout to set up a UPI AutoPay mandate with their
    bank, up to a limit per debit, and approves it once in the bank with their PIN. While it is active,
    Sprout services may debit within the limit (each debit lands in the customer's Sprout balance like
    a deposit) and hear about the customer's UPI spends, which is what round-ups are made from.

    **Retries are safe.** `POST` requests need an `Idempotency-Key` header (any unique string, e.g. a
    UUID); repeating a request with the same key returns the original result instead of moving money
    twice. Amounts are decimal strings in rupees; each payment is between ₹1 and ₹1,00,000.
servers:
  - url: http://localhost:8100/api/payments
    description: Through the gateway
paths:
  /v1/balance:
    get:
      operationId: getBalance
      summary: My Sprout cash
      responses:
        '200':
          description: Available to invest or withdraw, and on its way out.
          content:
            application/json:
              schema:
                type: object
                required: [available, withdrawing]
                properties:
                  available: { $ref: '#/components/schemas/Amount' }
                  withdrawing: { $ref: '#/components/schemas/Amount' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NoAccount' }
  /v1/deposits:
    post:
      operationId: addMoney
      summary: Add money from my bank (UPI collect)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoneyRequest' }
      responses:
        '201':
          description: 'Asked the bank; approve it there with your UPI PIN.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '200':
          description: The same Idempotency-Key was used before; the original deposit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NoAccount' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listDeposits
      summary: My deposits, newest first
      responses:
        '200':
          description: Deposits.
          content:
            application/json:
              schema:
                type: object
                required: [deposits]
                properties:
                  deposits: { type: array, items: { $ref: '#/components/schemas/Deposit' } }
  /v1/deposits/{id}:
    get:
      operationId: getDeposit
      summary: One of my deposits
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The deposit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deposit' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/withdrawals:
    post:
      operationId: withdraw
      summary: Send money back to my bank
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoneyRequest' }
      responses:
        '201':
          description: 'Held and sent to the bank; `COMPLETED` when the bank has paid it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '200':
          description: The same Idempotency-Key was used before; the original withdrawal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NoAccount' }
        '422':
          description: 'More than the available balance (`INSUFFICIENT_FUNDS`). Nothing moved.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listWithdrawals
      summary: My withdrawals, newest first
      responses:
        '200':
          description: Withdrawals.
          content:
            application/json:
              schema:
                type: object
                required: [withdrawals]
                properties:
                  withdrawals: { type: array, items: { $ref: '#/components/schemas/Withdrawal' } }
  /v1/withdrawals/{id}:
    get:
      operationId: getWithdrawal
      summary: One of my withdrawals
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mandates:
    post:
      operationId: setUpAutoPay
      summary: Ask my bank for an AutoPay mandate for round-ups
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [maxAmount]
              properties:
                maxAmount: { $ref: '#/components/schemas/Amount' }
      responses:
        '201':
          description: Asked; approve it in Sprout Bank.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPay' }
        '200':
          description: Already asked with this key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPay' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NoAccount' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/mandates/me:
    get:
      operationId: getMyAutoPay
      summary: My latest AutoPay mandate
      responses:
        '200':
          description: The mandate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPay' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/mandate-debits:
    post:
      operationId: debitAutoPay
      summary: Take money from a customer's bank under their AutoPay (Sprout services only)
      description: |
        For Sprout services (header `X-Service-Key`). Debits the customer's bank under their active
        mandate and credits their Sprout balance. Unique per `reference`: repeating it returns the first
        result. A definite refusal (no active mandate, above its limit, not enough money in the bank)
        is `FAILED` with the reason; an unknown outcome is a `503`, and repeating it is safe.
      security: [{ serviceKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, amount, reference, description]
              properties:
                userId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/Amount' }
                reference: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Done or refused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPayDebit' }
        '200':
          description: Done before with this reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPayDebit' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/spends:
    get:
      operationId: listSpends
      summary: Customers' UPI spends their AutoPay shares, oldest first (Sprout services only)
      description: Read with the `next` of the previous page as `after`, to see each spend once.
      security: [{ serviceKey: [] }]
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200':
          description: A page of spends.
          content:
            application/json:
              schema:
                type: object
                required: [spends, next]
                properties:
                  spends: { type: array, items: { $ref: '#/components/schemas/Spend' } }
                  next: { type: integer, format: int64, description: 'Pass as `after` for the next page.' }
        '401': { $ref: '#/components/responses/Problem' }
  /internal/v1/bank-events:
    post:
      operationId: receiveBankEvent
      summary: Sprout Bank tells Sprout what happened to a collect request or mandate
      description: |
        Called by the bank, not by clients. The body is a `BankEvent` or `MandateEvent` (see the Sprout Bank API) signed
        with HMAC-SHA256 under the key Sprout and the bank share: header
        `X-Bank-Signature: sha256=<hex of HMAC(body)>`. Unsigned or wrongly signed events are refused.
        Events can arrive more than once and out of order; each is applied at most once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '204': { description: 'Applied, or already applied.' }
        '401':
          description: 'Missing or wrong signature (`INVALID_SIGNATURE`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: 'Couldn''t apply it now; the bank retries.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    serviceKey: { type: apiKey, in: header, name: X-Service-Key }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
  responses:
    Problem:
      description: 'A problem: `VALIDATION_FAILED`, `UNAUTHENTICATED` or `UPSTREAM_UNAVAILABLE`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoAccount:
      description: 'Open a Sprout account first (`NO_ACCOUNT`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 'No such deposit or withdrawal of yours (`NOT_FOUND`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Amount:
      type: string
      pattern: '^[0-9]{1,13}(\.[0-9]{1,2})?$'
      example: '500.00'
    MoneyRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Amount' }
    Deposit:
      type: object
      required: [id, amount, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        status: { type: string, enum: [AWAITING_APPROVAL, COMPLETED, DECLINED, EXPIRED, FAILED] }
        bankRequestId: { type: string, description: 'The collect request in Sprout Bank, to approve there.' }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Withdrawal:
      type: object
      required: [id, amount, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        status: { type: string, enum: [PROCESSING, COMPLETED, FAILED] }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AutoPay:
      type: object
      required: [id, maxAmount, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        maxAmount: { $ref: '#/components/schemas/Amount' }
        status: { type: string, enum: [AWAITING_APPROVAL, ACTIVE, DECLINED, EXPIRED, REVOKED, FAILED] }
        bankMandateId: { type: string, description: 'The mandate in Sprout Bank, to approve there.' }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AutoPayDebit:
      type: object
      required: [id, userId, amount, reference, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        reference: { type: string }
        status: { type: string, enum: [COMPLETED, FAILED] }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
    Spend:
      type: object
      required: [seq, id, userId, amount, payeeName, at]
      properties:
        seq: { type: integer, format: int64 }
        id: { type: string, format: uuid, description: 'The bank''s id for the spend.' }
        userId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        payeeName: { type: string }
        at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, NO_ACCOUNT, NOT_FOUND, INSUFFICIENT_FUNDS, INVALID_SIGNATURE,
                 RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        retryAfterSeconds: { type: integer }
        requestId: { type: string }
security:
  - bearer: []
