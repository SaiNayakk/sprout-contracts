openapi: 3.0.3
info:
  title: Sprout Sandbox API v2 (the public demo)
  version: 2.0.0
  description: |
    The public sandbox: anyone can explore Sprout as a customer of their own, with months of real
    history, without signing up. Signing up for real works too.

    Clients reach these endpoints through the gateway under `/api/sandbox`, without signing in.

    **Who to explore as.** A visitor chooses who the customer is (a woman, a man, someone non-binary or
    of another gender, or no preference) and types the name the customer goes by. They are given an
    account of their own: nobody else is signed in to it, and it is named as they typed.

    **History is real.** The sandbox keeps a few accounts per group warm. Each lives every session of
    the sandbox's fast market (about 30 trading days a day) the way a real customer does, through the
    same services, exchange and books: a monthly plan, UPI spends rounded up into a pot, the odd share
    bought or sold, money added when cash runs low. A visitor is given the warm account with the most
    history in their group, and a new one starts warming in its place.

    **It ends.** An account belongs to its visitor for a limited time (`endsAt`); after that it is closed
    and its data swept away. Nothing a visitor types is kept beyond that.

    **Deprecated: use v3** (sandbox-v3.yaml), a demo account of the visitor's own with no choosing of who to be.
    The sandbox no longer answers this version.
servers:
  - url: http://localhost:8100/api/sandbox
    description: Through the gateway
paths:
  /v2/groups:
    get:
      operationId: listGroups
      deprecated: true
      summary: Who a visitor can explore as, and what their customer will be like
      security: []
      responses:
        '200':
          description: 'The groups, each with the customer a visitor would get (without a name: the visitor gives that).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Groups' }
  /v2/demo-sessions:
    post:
      operationId: startDemo
      deprecated: true
      summary: Explore Sprout as a customer of your own, from the chosen group, named as you choose
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group, name]
              properties:
                group: { type: string, enum: [WOMEN, MEN, NON_BINARY_AND_OTHER, ANY] }
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: 'What the customer is called. Letters, spaces and . , - '' only.'
                  example: Asha
      responses:
        '201':
          description: Signed in as the visitor's own customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '503':
          description: 'No account in the group is ready yet, or it can''t be signed in right now (`UPSTREAM_UNAVAILABLE`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  responses:
    Problem:
      description: 'A problem: `VALIDATION_FAILED` or `UPSTREAM_UNAVAILABLE`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Customer:
      type: object
      required: [group, pronouns, city, story]
      properties:
        name: { type: string, example: Asha, description: 'As the visitor typed it (absent before they have chosen).' }
        group: { type: string, enum: [WOMEN, MEN, NON_BINARY_AND_OTHER] }
        pronouns: { type: string, example: she/her }
        city: { type: string, example: Pune }
        story: { type: string, description: 'Who they are and what they are saving for (fictional).' }
    Group:
      type: object
      required: [code, label]
      properties:
        code: { type: string, enum: [WOMEN, MEN, NON_BINARY_AND_OTHER, ANY] }
        label: { type: string, example: Non-binary or another gender }
        customer: { $ref: '#/components/schemas/Customer' }
        ready: { type: boolean, description: 'Whether an account in the group is ready to explore now.' }
    Groups:
      type: object
      required: [groups]
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/Group' } }
    DemoSession:
      type: object
      required: [customer, sessionsLived, endsAt, accessToken, tokenType, expiresIn, refreshToken]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        sessionsLived: { type: integer, description: 'How many trading sessions of history the account has.' }
        endsAt: { type: string, format: date-time, description: 'When the account is closed and swept away.' }
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer }
        refreshToken: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, enum: [VALIDATION_FAILED, RATE_LIMITED, UPSTREAM_UNAVAILABLE] }
        retryAfterSeconds: { type: integer }
        requestId: { type: string }
