openapi: 3.0.3
info:
  title: Sprout Orders API
  version: 1.0.0
  description: |
    Buying and selling shares: orders, what you hold, your intraday positions and your funds.

    Clients reach these endpoints through the gateway under `/api/oms`. Every endpoint except the
    exchange's callback needs a signed-in user with an open Sprout account.

    **Products.**
    - `CNC` (delivery): buy with your own money and keep the shares. You can only sell shares you
      hold; delivery short selling isn't allowed.
    - `MIS` (intraday): trade with 5x leverage. You put up a fifth of the value as margin, can sell
      first and buy back later (short), and every intraday position is closed by Sprout at 15:20
      ("auto square-off", which costs ₹50 + GST) if you haven't closed it yourself. A position whose
      loss eats 90% of its margin is closed early. Losses beyond your money become dues, recovered
      from your next deposit.

    **Orders** are `MARKET` (executes at once at the market price, with 3% price protection) or
    `LIMIT` (executes at your price or better, or not at all; unfilled orders expire at the close).
    A `REGULAR` order can only be placed while the market is open. An `AMO` (after-market order) is
    placed while it is closed and sent to the exchange when it next opens.

    **Placing an order blocks money** at once: the order's value (at the limit price, or the market
    price plus protection) plus its estimated charges for a delivery buy, or a fifth of the value
    plus charges for an intraday trade. Orders that close what you already have (a delivery sell,
    or closing an intraday position) block nothing. When the order executes, its real cost is taken
    and the rest is given back; a cancelled, expired or rejected order gives everything back.

    **An order the risk checks or the exchange refuse is still an order**: it comes back `REJECTED`
    with the reason, like a broker's order book shows it. Requests that are simply wrong (unknown
    symbol, bad quantity) are `4xx` problems instead.

    **Charges** are those of a discount broker in India: no brokerage on delivery; intraday ₹20 or
    0.03% per executed order, whichever is lower; STT, exchange transaction charges, SEBI fees,
    stamp duty and 18% GST as the rules set them. Every executed order shows its charges.

    **Sale proceeds** are `unsettled` until the trade settles (T+1); they can't be invested or
    withdrawn before then. Shares bought today are `t1Quantity` until they are delivered.

    **Retries are safe.** `POST /v1/orders` needs an `Idempotency-Key` header; repeating a request
    with the same key returns the original order instead of placing another.
servers:
  - url: http://localhost:8100/api/oms
    description: Through the gateway
paths:
  /v1/orders:
    post:
      operationId: placeOrder
      summary: Place an order
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewOrder' }
      responses:
        '201':
          description: 'Placed: `OPEN`, `FILLED`, `AMO_QUEUED`, `PENDING` (sent, the exchange hasn''t answered yet) or `REJECTED` with the reason.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: The same Idempotency-Key was used before; the original order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NoAccount' }
        '422':
          description: 'No such tradable instrument (`UNKNOWN_INSTRUMENT`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listOrders
      summary: My orders, newest first
      responses:
        '200':
          description: Up to 100 orders.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/orders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getOrder
      summary: One of my orders
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelOrder
      summary: Cancel an open or queued order
      responses:
        '200':
          description: 'Cancelled; the blocked money is back.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'It already executed, expired or was rejected (`ORDER_NOT_OPEN`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/holdings:
    get:
      operationId: listHoldings
      summary: Shares I own (delivery)
      responses:
        '200':
          description: Holdings, valued at the last price.
          content:
            application/json:
              schema:
                type: object
                required: [holdings]
                properties:
                  holdings: { type: array, items: { $ref: '#/components/schemas/Holding' } }
  /v1/positions:
    get:
      operationId: listPositions
      summary: My intraday (MIS) positions, open and closed today
      responses:
        '200':
          description: Positions, marked to the last price.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions: { type: array, items: { $ref: '#/components/schemas/Position' } }
  /v1/funds:
    get:
      operationId: getFunds
      summary: My money, as trading sees it
      responses:
        '200':
          description: Where my money is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funds' }
        '404': { $ref: '#/components/responses/NoAccount' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/exchange-events:
    post:
      operationId: receiveExchangeEvent
      summary: The exchange tells Sprout what happened to an order
      description: |
        Called by the exchange, not by clients. The body is an `ExecutionEvent` (see the exchange's
        API), signed: `X-Exchange-Signature: sha256=<hex of HMAC(body)>`. Unsigned or wrongly signed
        events are refused. Each event is applied at most once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '204': { description: 'Applied, or already applied.' }
        '401':
          description: 'Missing or wrong signature (`INVALID_SIGNATURE`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: 'Couldn''t apply it now; the exchange retries.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
  responses:
    Problem:
      description: 'A problem: `VALIDATION_FAILED`, `UNAUTHENTICATED`, `RATE_LIMITED` or `UPSTREAM_UNAVAILABLE`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoAccount:
      description: 'Open a Sprout account first (`NO_ACCOUNT`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 'No such order of yours (`NOT_FOUND`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Amount:
      type: string
      pattern: '^[0-9]{1,13}(\.[0-9]{1,2})?$'
      example: '1520.35'
    SignedAmount:
      type: string
      pattern: '^-?[0-9]{1,13}(\.[0-9]{1,2})?$'
      example: '-42.50'
    NewOrder:
      type: object
      additionalProperties: false
      required: [symbol, side, quantity, orderType, product]
      properties:
        symbol: { type: string, example: HARBOR }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        orderType: { type: string, enum: [MARKET, LIMIT] }
        limitPrice: { $ref: '#/components/schemas/Amount' }
        product: { type: string, enum: [CNC, MIS] }
        variety: { type: string, enum: [REGULAR, AMO], default: REGULAR }
    Charges:
      type: object
      required: [brokerage, stt, exchangeCharges, sebiFees, stampDuty, gst, total]
      properties:
        brokerage: { $ref: '#/components/schemas/Amount' }
        stt: { $ref: '#/components/schemas/Amount' }
        exchangeCharges: { $ref: '#/components/schemas/Amount' }
        sebiFees: { $ref: '#/components/schemas/Amount' }
        stampDuty: { $ref: '#/components/schemas/Amount' }
        gst: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
    Order:
      type: object
      required: [id, symbol, side, quantity, orderType, product, variety, status, blocked, autoSquareOff, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer }
        orderType: { type: string, enum: [MARKET, LIMIT] }
        limitPrice: { $ref: '#/components/schemas/Amount' }
        product: { type: string, enum: [CNC, MIS] }
        variety: { type: string, enum: [REGULAR, AMO] }
        status: { type: string, enum: [AMO_QUEUED, PENDING, OPEN, FILLED, CANCELLED, EXPIRED, REJECTED] }
        blocked: { $ref: '#/components/schemas/Amount' }
        price: { $ref: '#/components/schemas/Amount' }
        value: { $ref: '#/components/schemas/Amount' }
        charges: { $ref: '#/components/schemas/Charges' }
        realisedPnl: { $ref: '#/components/schemas/SignedAmount' }
        autoSquareOff: { type: boolean, description: 'Placed by Sprout to close an intraday position.' }
        rejection:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INSUFFICIENT_FUNDS, INSUFFICIENT_HOLDINGS, MARKET_CLOSED, MARKET_OPEN, INTRADAY_CLOSED, POSITION_FLIP,
                     PRICE_OUT_OF_BAND, INVALID_TICK, UNAVAILABLE]
            message: { type: string }
        reason: { type: string, description: 'Why it was cancelled or expired.' }
        filledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Holding:
      type: object
      required: [symbol, quantity, t1Quantity, averagePrice, investedValue]
      properties:
        symbol: { type: string }
        quantity: { type: integer, description: 'All the shares, delivered or not.' }
        t1Quantity: { type: integer, description: 'Bought, not delivered yet.' }
        averagePrice: { $ref: '#/components/schemas/Amount' }
        investedValue: { $ref: '#/components/schemas/Amount' }
        lastPrice: { $ref: '#/components/schemas/Amount' }
        currentValue: { $ref: '#/components/schemas/Amount' }
        pnl: { $ref: '#/components/schemas/SignedAmount' }
    Position:
      type: object
      required: [symbol, product, quantity, margin, realisedPnl, sessionDate]
      properties:
        symbol: { type: string }
        product: { type: string, enum: [MIS] }
        quantity: { type: integer, description: 'Positive long, negative short, zero closed.' }
        averagePrice: { $ref: '#/components/schemas/Amount' }
        margin: { $ref: '#/components/schemas/Amount' }
        lastPrice: { $ref: '#/components/schemas/Amount' }
        unrealisedPnl: { $ref: '#/components/schemas/SignedAmount' }
        realisedPnl: { $ref: '#/components/schemas/SignedAmount' }
        sessionDate: { type: string, format: date }
    Funds:
      type: object
      required: [availableToTrade, cash, blocked, unsettled, dues]
      properties:
        availableToTrade: { $ref: '#/components/schemas/Amount' }
        cash: { $ref: '#/components/schemas/Amount' }
        blocked: { $ref: '#/components/schemas/Amount' }
        unsettled: { $ref: '#/components/schemas/Amount' }
        dues: { $ref: '#/components/schemas/Amount' }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, NO_ACCOUNT, NOT_FOUND, UNKNOWN_INSTRUMENT, ORDER_NOT_OPEN,
                 INVALID_SIGNATURE, RATE_LIMITED, UPSTREAM_UNAVAILABLE]
        retryAfterSeconds: { type: integer }
        requestId: { type: string }
security:
  - bearer: []
