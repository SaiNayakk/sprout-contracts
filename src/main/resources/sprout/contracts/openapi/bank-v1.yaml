openapi: 3.0.3
info:
  title: Sprout Bank API (simulated bank)
  version: 1.0.0
  description: |
    **Sprout Bank is not part of Sprout.** It simulates the customer's own bank and its UPI app, so
    money can move end to end. No real money exists here.

    Two kinds of caller:

    - **Customers** (through the gateway under `/api/bank`, signed in with their Sprout login; a real
      bank would have its own): open an account with a starting balance of ₹1,00,000, set a UPI PIN,
      see and approve or decline payment requests with that PIN, and see their transactions.
    - **Partners** (businesses with an account here: Sprout, and the clearing corporation; `/partner/...`),
      authenticated with the header `X-Partner-Key`: check a UPI address exists, ask a customer for
      money (a collect request), pay money to anyone with an account here (customers or other
      partners), and read their own statement, filtered by the reference a payment carried, to match
      money that arrived to what they were expecting.

    **UPI PIN.** 4 or 6 digits, not all the same and not a simple sequence; stored hashed. Three wrong
    PINs lock approvals for 15 minutes.

    **Paying.** Customers pay anyone with an account here by UPI address and PIN, such as the demo
    merchants listed at `/v1/merchants` (fictional shops: a chai stall, a metro card, a grocer).

    **AutoPay mandates** (like UPI AutoPay): a partner asks a customer for standing permission to debit
    up to a fixed amount each time, for a stated purpose. The customer approves once, with their UPI
    PIN; the partner can then debit within that limit without asking again, until the customer revokes
    it. A mandate may also ask to be told about the customer's UPI spends (`shareSpends`), as round-up
    apps do; the customer sees that before approving. Unanswered mandate requests expire after 15
    minutes. Mandate outcomes and shared spends are sent to the mandate's callback as `MandateEvent`s,
    signed and retried like `BankEvent`s.

    **Collect requests** wait for the customer for 5 minutes, then expire. Every outcome (approved,
    declined, expired) is sent to the partner's callback as a `BankEvent`, signed with HMAC-SHA256
    (`X-Bank-Signature: sha256=<hex>`), and retried until it is acknowledged.

    Amounts are decimal strings in rupees.
servers:
  - url: http://localhost:8100/api/bank
    description: Through the gateway (customers)
  - url: http://localhost:8107
    description: The bank, directly (partners)
paths:
  /v1/accounts:
    post:
      operationId: openBankAccount
      summary: Open my Sprout Bank account and set my UPI PIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenBankAccountRequest' }
      responses:
        '201':
          description: Opened, with ₹1,00,000 to start.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/accounts/me:
    get:
      operationId: getMyBankAccount
      summary: My bank account
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/requests:
    get:
      operationId: listRequests
      summary: Payment requests to me, newest first
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, DECLINED, EXPIRED] } }
      responses:
        '200':
          description: Requests.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/CollectRequest' } }
  /v1/requests/{id}/approve:
    post:
      operationId: approveRequest
      summary: Pay a request, with my UPI PIN
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upiPin]
              properties:
                upiPin: { type: string }
      responses:
        '200':
          description: Paid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectRequest' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'No longer pending (`REQUEST_NOT_PENDING`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 'Wrong PIN (`INVALID_PIN`, with attempts left) or not enough money (`INSUFFICIENT_BALANCE`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: 'Too many wrong PINs; locked for a while (`PIN_LOCKED`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/requests/{id}/decline:
    post:
      operationId: declineRequest
      summary: Refuse a request
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectRequest' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/merchants:
    get:
      operationId: listMerchants
      summary: Demo merchants a customer can pay (fictional shops)
      responses:
        '200':
          description: Merchants.
          content:
            application/json:
              schema:
                type: object
                required: [merchants]
                properties:
                  merchants: { type: array, items: { $ref: '#/components/schemas/Merchant' } }
  /v1/payments:
    post:
      operationId: payByUpi
      summary: Pay someone by UPI address, with my UPI PIN
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Optional. Repeating a request with the same key returns the original result (200) instead of doing it again.', schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payeeVpa, amount, upiPin]
              properties:
                payeeVpa: { type: string }
                amount: { $ref: '#/components/schemas/Amount' }
                upiPin: { type: string }
                note: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Paid. The debit from my account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '200':
          description: 'The same request again (same Idempotency-Key): the original result.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: 'Wrong PIN (`INVALID_PIN`, with attempts left) or not enough money (`INSUFFICIENT_BALANCE`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: 'Too many wrong PINs; locked for a while (`PIN_LOCKED`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/mandates:
    get:
      operationId: listMandates
      summary: AutoPay mandates asked of me, newest first
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, ACTIVE, DECLINED, EXPIRED, REVOKED] } }
      responses:
        '200':
          description: Mandates.
          content:
            application/json:
              schema:
                type: object
                required: [mandates]
                properties:
                  mandates: { type: array, items: { $ref: '#/components/schemas/Mandate' } }
  /v1/mandates/{id}/approve:
    post:
      operationId: approveMandate
      summary: Grant a mandate, with my UPI PIN
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upiPin]
              properties:
                upiPin: { type: string }
      responses:
        '200':
          description: Active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mandate' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'No longer pending (`REQUEST_NOT_PENDING`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 'Wrong PIN (`INVALID_PIN`, with attempts left).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: 'Too many wrong PINs; locked for a while (`PIN_LOCKED`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/mandates/{id}/decline:
    post:
      operationId: declineMandate
      summary: Refuse a mandate
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mandate' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/mandates/{id}/revoke:
    post:
      operationId: revokeMandate
      summary: Withdraw a mandate I granted; no further debits
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mandate' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/transactions:
    get:
      operationId: listTransactions
      summary: My bank statement, newest first
      responses:
        '200':
          description: Transactions.
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
  /app:
    get:
      operationId: bankApp
      summary: The Sprout Bank web page
      security: []
      responses:
        '200':
          description: HTML.
          content:
            text/html:
              schema: { type: string }
  /partner/v1/vpas/{vpa}:
    get:
      operationId: lookUpVpa
      summary: Does this UPI address exist, and whose is it?
      security: [{ partnerKey: [] }]
      parameters: [{ name: vpa, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: It exists.
          content:
            application/json:
              schema:
                type: object
                required: [vpa, holderName]
                properties:
                  vpa: { type: string }
                  holderName: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /partner/v1/collect-requests:
    post:
      operationId: createCollectRequest
      summary: Ask a customer for money
      security: [{ partnerKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payerVpa, amount, reference, callbackUrl]
              properties:
                payerVpa: { type: string }
                amount: { $ref: '#/components/schemas/Amount' }
                reference: { type: string, maxLength: 120, description: 'The partner''s id for this payment. Unique: asking again with the same reference returns the same request.' }
                note: { type: string, maxLength: 100 }
                callbackUrl: { type: string, description: 'Where BankEvents for this request are sent.' }
      responses:
        '201':
          description: Waiting for the customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectRequest' }
        '200':
          description: Already created with this reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /partner/v1/collect-requests/{id}:
    get:
      operationId: getCollectRequest
      summary: A collect request's status (for reconciliation)
      security: [{ partnerKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectRequest' }
        '404': { $ref: '#/components/responses/Problem' }
  /partner/v1/mandates:
    post:
      operationId: requestMandate
      summary: Ask a customer for an AutoPay mandate
      security: [{ partnerKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payerVpa, maxAmount, purpose, reference, callbackUrl]
              properties:
                payerVpa: { type: string }
                maxAmount: { $ref: '#/components/schemas/Amount' }
                purpose: { type: string, maxLength: 100, description: 'Shown to the customer, e.g. "Round-ups into your Sprout goals".' }
                reference: { type: string, maxLength: 120, description: 'Unique per partner: asking again returns the same mandate.' }
                shareSpends: { type: boolean, default: false, description: 'Also tell the partner about the customer''s UPI spends while active.' }
                callbackUrl: { type: string, description: 'Where MandateEvents are sent.' }
      responses:
        '201':
          description: Waiting for the customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mandate' }
        '200':
          description: Already requested with this reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mandate' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /partner/v1/mandates/{id}:
    get:
      operationId: getMandate
      summary: A mandate's status (for reconciliation)
      security: [{ partnerKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: The mandate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mandate' }
        '404': { $ref: '#/components/responses/Problem' }
  /partner/v1/mandates/{id}/debits:
    post:
      operationId: debitMandate
      summary: Take money under an active mandate, within its limit
      security: [{ partnerKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, reference]
              properties:
                amount: { $ref: '#/components/schemas/Amount' }
                reference: { type: string, maxLength: 120, description: 'Unique per partner: debiting again with it returns the original debit.' }
      responses:
        '201':
          description: Debited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MandateDebit' }
        '200':
          description: Already debited with this reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MandateDebit' }
        '400':
          description: 'Above the mandate''s limit, or not a valid amount (`VALIDATION_FAILED`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'The mandate isn''t active (`REQUEST_NOT_PENDING`, with its status).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 'Not enough money (`INSUFFICIENT_BALANCE`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /partner/v1/payouts:
    post:
      operationId: payOut
      summary: Pay money to a customer or another business
      security: [{ partnerKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payeeVpa, amount, reference]
              properties:
                payeeVpa: { type: string }
                amount: { $ref: '#/components/schemas/Amount' }
                reference: { type: string, maxLength: 120, description: 'Unique per payout: paying again with the same reference returns the original payout.' }
      responses:
        '201':
          description: Paid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '200':
          description: Already paid with this reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /partner/v1/account:
    get:
      operationId: getPartnerAccount
      summary: My own account and its balance (for reconciliation)
      security: [{ partnerKey: [] }]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '401': { $ref: '#/components/responses/Problem' }
  /partner/v1/transactions:
    get:
      operationId: getPartnerStatement
      summary: My own account's movements, newest first (at most 100)
      security: [{ partnerKey: [] }]
      parameters:
        - { name: reference, in: query, required: false, schema: { type: string }, description: 'Only movements that carried this reference.' }
      responses:
        '200':
          description: The movements.
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        '401': { $ref: '#/components/responses/Problem' }
  /partner/v1/payouts/{reference}:
    get:
      operationId: getPayout
      summary: A payout by its reference (for reconciliation)
      security: [{ partnerKey: [] }]
      parameters: [{ name: reference, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: The payout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    partnerKey: { type: apiKey, in: header, name: X-Partner-Key }
  responses:
    Problem:
      description: 'A problem: `VALIDATION_FAILED`, `UNAUTHENTICATED`, `INVALID_PARTNER_KEY`, `NOT_FOUND`, `ACCOUNT_EXISTS`, `WEAK_PIN`, `INSUFFICIENT_BALANCE`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Amount:
      type: string
      pattern: '^[0-9]{1,13}(\.[0-9]{1,2})?$'
    OpenBankAccountRequest:
      type: object
      additionalProperties: false
      required: [holderName, upiPin]
      properties:
        holderName: { type: string, minLength: 2, maxLength: 100 }
        upiPin: { type: string, pattern: '^([0-9]{4}|[0-9]{6})$' }
    BankAccount:
      type: object
      required: [vpa, holderName, balance, openedAt]
      properties:
        vpa: { type: string, example: asha.rao@sproutbank }
        holderName: { type: string }
        balance: { $ref: '#/components/schemas/Amount' }
        openedAt: { type: string, format: date-time }
    CollectRequest:
      type: object
      required: [id, payerVpa, payeeVpa, payeeName, amount, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        payerVpa: { type: string }
        payeeVpa: { type: string }
        payeeName: { type: string, example: Sprout Investments }
        amount: { $ref: '#/components/schemas/Amount' }
        note: { type: string }
        reference: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, DECLINED, EXPIRED] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    Payout:
      type: object
      required: [id, payeeVpa, amount, reference, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        payeeVpa: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        reference: { type: string }
        status: { type: string, enum: [COMPLETED] }
        createdAt: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, amount, direction, description, balanceAfter, at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        direction: { type: string, enum: [IN, OUT] }
        description: { type: string }
        counterparty: { type: string }
        reference: { type: string, description: 'What the payer said it was for (a payout''s reference).' }
        balanceAfter: { $ref: '#/components/schemas/Amount' }
        at: { type: string, format: date-time }
    Merchant:
      type: object
      required: [vpa, name, category]
      properties:
        vpa: { type: string, example: monsoonchai@sproutbank }
        name: { type: string, example: Monsoon Chai }
        category: { type: string, example: Food and drink }
    Mandate:
      type: object
      required: [id, payerVpa, payeeVpa, payeeName, maxAmount, purpose, shareSpends, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        payerVpa: { type: string }
        payeeVpa: { type: string }
        payeeName: { type: string, example: Sprout Investments }
        maxAmount: { $ref: '#/components/schemas/Amount' }
        purpose: { type: string }
        reference: { type: string }
        shareSpends: { type: boolean }
        status: { type: string, enum: [PENDING, ACTIVE, DECLINED, EXPIRED, REVOKED] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 'When an unanswered request lapses.' }
        decidedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    MandateDebit:
      type: object
      required: [id, mandateId, amount, reference, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        mandateId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        reference: { type: string }
        status: { type: string, enum: [COMPLETED] }
        createdAt: { type: string, format: date-time }
    MandateEvent:
      type: object
      description: |
        Sent to a mandate's callbackUrl, signed like a BankEvent. At least once; apply each eventId once.
        `SPEND` (only for mandates with shareSpends, while active) reports one UPI payment the customer
        made: its id, amount and payee.
      required: [eventId, type, mandateId, reference, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string, enum: [MANDATE_ACTIVE, MANDATE_DECLINED, MANDATE_EXPIRED, MANDATE_REVOKED, SPEND] }
        mandateId: { type: string, format: uuid }
        reference: { type: string, description: 'The mandate''s reference.' }
        spendId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        payeeName: { type: string }
        occurredAt: { type: string, format: date-time }
    BankEvent:
      type: object
      description: Sent to a collect request's callbackUrl, signed. At least once; apply each eventId once.
      required: [eventId, type, requestId, reference, amount, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string, enum: [COLLECT_APPROVED, COLLECT_DECLINED, COLLECT_EXPIRED] }
        requestId: { type: string, format: uuid }
        reference: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
